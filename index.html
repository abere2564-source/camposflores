<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <title>Para mi amor - Nuestro Jardín</title>

    <link href="https://fonts.googleapis.com/css2?family=Arial+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="flowers.png" type="image/x-icon">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-engine@2/tsparticles.engine.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-basic@2/tsparticles.basic.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-shape-image@2/tsparticles.shape.image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-move-base@2/tsparticles.move.base.min.js"></script>
</head>
<body class="container">

    <!-- PANTALLA DE INICIO INFALIBLE PARA EL AUDIO -->
    <div id="pantalla-inicio">
        <button id="boton-iniciar">💖 Entrar al Jardín 💖</button>
    </div>

    <audio id="miAudio" src="./I Wanna Be Yours.mp3" type="audio/mpeg" loop preload="auto"></audio>

    <div id="tsparticles"></div>
    <div class="night"></div>
    
    <!-- FRASES SECUENCIALES -->
    <div id="message-container"></div>

    <!-- CONTENEDOR DE LA FOTO POLAROID -->
    <div id="photo-container">
        <div class="polaroid">
            <div class="photo-frame">
                <img src="pareja.jpeg" alt="Nosotros" />
            </div>
            <p class="polaroid-caption">✨ Te amo ✨</p>
        </div>
    </div>

    <!-- LETRAS DE LA CANCIÓN -->
    <div id="lyrics"></div>
    
    <div id="garden-container"></div>
    <div id="fireflies-container"></div>

    <script src="main.js" defer></script>
</body>
</html>
